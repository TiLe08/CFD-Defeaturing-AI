# conda env create -f env/environment.yml && conda activate fad
name: fad
channels: [conda-forge]
dependencies:
  - python=3.11
  - numpy>=2.0
  - scipy>=1.13
  - pandas>=2.2
  - pyarrow>=16
  - shapely>=2.0
  - trimesh>=4.4
  - mapbox_earcut>=1.0
  - pytest>=8
  - fastapi>=0.110
  - uvicorn>=0.29
  - python-multipart>=0.0.9
  - httpx>=0.27
  - networkx>=3.2
  - pip
  - pip:
      - manifold3d>=2.4
      - gmsh>=4.11
